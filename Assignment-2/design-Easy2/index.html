<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights & Blogs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <header class="navbar">
        <div class="logo-section">
          <img src="./assets/Logo.png" alt="logo" class="logo-icon" />
        </div>

        <nav class="nav-links">
          <a href="#">Home</a>
          <a href="#">About Us</a>
          <a href="#">Blogs</a>
          <a href="#">Contact Us</a>
        </nav>

        <button class="start-btn">Get Started</button>
      </header>
      <section class="hero-section">
        <h1>Insights & Blogs</h1>
        <div class="category-wrapper">
          <button class="category-btn active">All</button>
          <button class="category-btn">Tech</button>
          <button class="category-btn">SaaS</button>
          <button class="category-btn">Marketing</button>
        </div>
      </section>
      <section class="blogs-section">
        <div class="blog-card">
          <div class="image-wrapper">
            <img src="./assets/wine-glass.png" alt="cocktail" />
          </div>
          <div class="card-content">
            <span class="tag">Tech</span>
            <h3>The Ultimate Guide To SaaS Marketing</h3>
            <p>May 23, 2025</p>
          </div>
        </div>

        <div class="blog-card">
          <div class="image-wrapper">
            <img src="./assets/chair.png" alt="chair" />
          </div>
          <div class="card-content">
            <span class="tag">SaaS</span>
            <h3>5 Key Trends In SaaS Growth For 2025</h3>
            <p>May 23, 2025</p>
          </div>
        </div>

        <div class="blog-card">
          <div class="image-wrapper">
            <img src="./assets/cat.png" alt="cat" />
          </div>
          <div class="card-content">
            <span class="tag">Marketing</span>
            <h3>How Data-Driven Strategies Are Important</h3>
            <p>May 23, 2025</p>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
